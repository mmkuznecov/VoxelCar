[project]
name = "voxel-car-demo"
version = "0.1.0"
description = "Procedural voxel landscape driving simulator with multi-camera rendering and dataset generator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gradio>=4.0",
    "numpy>=1.24",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "Pillow>=10.0",
    "joblib>=1.3",
    "gymnasium>=1.1.1",
    "stable-baselines3>=2.7.1",
    "tensorboard>=2.20.0",
    "torch",
    "matplotlib",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxel_car"]